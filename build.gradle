plugins {
	id 'net.fabricmc.fabric-loom-remap' version '1.14-SNAPSHOT' apply false
	// https://github.com/ReplayMod/preprocessor
	// https://github.com/Fallen-Breath/preprocessor
	id 'com.replaymod.preprocess' version 'd452ef7612'
}

preprocess {
	strictExtraMappings = false

	def mc12100 = createNode('1.21.0', 1_21_00, 'yarn')
	def mc12101 = createNode('1.21.1', 1_21_01, 'yarn')
	def mc12103 = createNode('1.21.3', 1_21_03, 'yarn')
	def mc12104 = createNode('1.21.4', 1_21_04, 'yarn')
	def mc12105 = createNode('1.21.5', 1_21_05, 'yarn')
	def mc12108 = createNode('1.21.8', 1_21_08, 'yarn')
	def mc12110 = createNode('1.21.10', 1_21_10, 'yarn')
	def mc12111 = createNode('1.21.11', 1_21_11, 'yarn')

	// mapping difference map
	mc12101.link(mc12100, null)
	mc12103.link(mc12101, null)
	mc12104.link(mc12103, null)
	mc12105.link(mc12104, null)
	mc12108.link(mc12105, null)
	mc12110.link(mc12108, null)
	mc12111.link(mc12110, null)
}
// commands
// gradlew build -> build all subprojects
// gradlew buildAndGather -> build all subprojects and gather all jars into build/libs
// gradlew clean -> clean gradle cache

// preprocessor command, see https://github.com/ReplayMod/preprocessor for more information
// gradlew :1.16.5:setCoreVersion -> set coremod version to 1.16.5
tasks.register('buildAndGather') {
	subprojects {
		dependsOn project.tasks.named('build').get()
	}
	doFirst {
		println 'Gathering builds'
		def buildLibs = {
			p -> p.buildDir.toPath().resolve('libs')
		}
		delete fileTree(buildLibs(rootProject)) {
			include '*'
		}
		subprojects {
			copy {
				from(buildLibs(project)) {
					include '*.jar'
					exclude '*-dev.jar', '*-sources.jar', '*-shadow.jar'
				}
				into buildLibs(rootProject)
				duplicatesStrategy = DuplicatesStrategy.INCLUDE
			}
		}
	}
}
